<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <!-- displays site properly based on user's device -->

        <link
            rel="icon"
            type="image/png"
            sizes="32x32"
            href="./images/favicon-32x32.png"
        />

        <title>Frontend Mentor | Stats preview card component</title>

        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
            crossorigin="anonymous"
        />
        <link rel="stylesheet" href="style.css" />
        <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
        <style>
            .attribution {
                font-size: 11px;
                text-align: center;
            }
            .attribution a {
                color: hsl(228, 45%, 44%);
            }
        </style>
    </head>
    <body>
        <!-- Get insights that help your business grow. Discover the benefits of data
        analytics and make better decisions regarding revenue, customer
        experience, and overall efficiency. 10k+ companies 314 templates 12m+
        queries -->
        <div class="container">
            <div class="row">
                <div class="carte rounded col-lg-6">
                    <h4 class="text-white">
                        Get <span>insights</span> that help your business grow
                    </h4>
                    <p class="mt-3">
                        Discover the benefits of data analytics and make better
                        decisions regarding revenue, customer experience, and
                        overall efficiency.
                    </p>
                    <div class="d-flex stats mt-5 justify-content-between">
                        <div>
                            <div class="stat-heading">10k+</div>
                            <div class="heading text-uppercase">companies</div>
                        </div>
                        <div>
                            <div class="stat-heading">314</div>
                            <div class="heading text-uppercase">templates</div>
                        </div>
                        <div>
                            <div class="stat-heading">12M+</div>
                            <div class="heading text-uppercase">queries</div>
                        </div>
                    </div>
                </div>
                <div class="image rounded col-lg-6 p-0"></div>
            </div>
        </div>

        <!-- <div class="attribution">
            Challenge by
            <a
                href="https://www.frontendmentor.io?ref=challenge"
                target="_blank"
                >Frontend Mentor</a
            >. Coded by <a href="#">Your Name Here</a>.
        </div> -->
        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
            crossorigin="anonymous"
        ></script>
    </body>
</html>
